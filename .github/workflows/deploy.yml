# ADR-004: deploy to Fly.io on every push to main.
# Secrets: this workflow authenticates to Infisical (self-hosted, ADR-003) with GitHub OIDC,
# reads the Production environment and stages it as Fly secrets before the deploy. No
# Infisical credential is stored anywhere. GitHub only holds FLY_API_TOKEN (deploy token
# scoped to the app) and two non-secret variables: INFISICAL_IDENTITY_ID, INFISICAL_PROJECT_SLUG.
# To apply a changed secret: edit it in Infisical and re-run this workflow (workflow_dispatch).
name: Deploy (Fly.io)

on:
  push:
    branches:
      - main
      # Temporary: first deploy before PR #35 is merged. Remove after the merge.
      - feat/RF04-baseline
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
      INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: check
        run: |
          missing=""
          [ -n "$FLY_API_TOKEN" ] || missing="$missing FLY_API_TOKEN(secret)"
          [ -n "$INFISICAL_IDENTITY_ID" ] || missing="$missing INFISICAL_IDENTITY_ID(variable)"
          [ -n "$INFISICAL_PROJECT_SLUG" ] || missing="$missing INFISICAL_PROJECT_SLUG(variable)"
          if [ -n "$missing" ]; then
            echo "::notice::Deploy skipped, not configured yet:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch secrets from Infisical (OIDC)
        if: steps.check.outputs.ready == 'true'
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          domain: https://secrets.minson.com.br
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check.outputs.ready == 'true'

      - name: Stage secrets on Fly
        if: steps.check.outputs.ready == 'true'
        run: |
          keys="DATABASE_URL APP_URL STRAVA_CLIENT_ID STRAVA_CLIENT_SECRET STRAVA_CALLBACK_URL STRAVA_API_BASE_URL STRAVA_OAUTH_BASE_URL STRAVA_WEBHOOK_VERIFY_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_CALLBACK_URL ADMIN_EMAILS TOKEN_ENCRYPTION_KEY"
          missing=""
          for k in $keys; do [ -n "${!k:-}" ] || missing="$missing $k"; done
          if [ -n "$missing" ]; then echo "::error::Missing in Infisical (prod):$missing"; exit 1; fi
          for k in $keys; do printf '%s=%s\n' "$k" "${!k}"; done | flyctl secrets import --stage

      - name: Deploy (remote build on Fly)
        if: steps.check.outputs.ready == 'true'
        run: flyctl deploy --remote-only --ha=false
