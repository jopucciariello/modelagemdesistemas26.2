# ADR-004: deploy to Fly.io on every push to main. The image is built on Fly's remote builder.
# App secrets are stored in Fly itself (imported once from Infisical, ADR-003); GitHub only
# holds FLY_API_TOKEN, a deploy token scoped to the app.
name: Deploy (Fly.io)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check FLY_API_TOKEN
        id: check
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN not configured; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check.outputs.ready == 'true'

      - name: Deploy (remote build on Fly)
        if: steps.check.outputs.ready == 'true'
        run: flyctl deploy --remote-only --ha=false
