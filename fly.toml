# GearLog on Fly.io (ADR-004). Secrets come from Infisical (ADR-003), imported with `fly secrets import`.
app = "gearlog"
primary_region = "gru"

[build]

[env]
  NODE_ENV = "production"

# SQLite file lives here; DATABASE_URL must be "file:/data/gearlog.db".
[mounts]
  source = "gearlog_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # SQLite on a volume: exactly one machine.
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/"
  timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
