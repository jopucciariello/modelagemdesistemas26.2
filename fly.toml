# GearLog on Fly.io (ADR-004). Secrets are pulled from Infisical at boot (ADR-003).
app = "gearlog-mds"
primary_region = "gru"

[build]

[env]
  NODE_ENV = "production"
  # Secrets are pulled from Infisical at boot (docker-entrypoint.sh). Fly secrets hold only
  # INFISICAL_CLIENT_ID and INFISICAL_CLIENT_SECRET (machine identity with read access).
  INFISICAL_PROJECT_ID = "REPLACE_WITH_INFISICAL_PROJECT_ID"
  INFISICAL_ENV = "prod"

# SQLite file lives here; DATABASE_URL must be "file:/data/gearlog.db".
[mounts]
  source = "gearlog_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # SQLite on a volume: exactly one machine.
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/"
  timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
